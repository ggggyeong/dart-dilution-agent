[project]
name = "filingscope"
version = "0.1.0"
description = "DART 희석 이벤트(유상증자·CB) 분석 에이전트"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pykrx>=1.2.9",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
